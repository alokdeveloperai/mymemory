<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My memory</title>
<style>
:root{--bg:#fff;--side:#f4f5f7;--fg:#1c2330;--mut:#5d6878;--line:#dfe3ea;--hover:#e8ebf0;--act:#0b4f9e;--actbg:#dfeaf8;--err:#a12222;--w:290px}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--side:#1a1e24;--fg:#e6e9ee;--mut:#9aa4b2;--line:#2c323b;--hover:#252a32;--act:#8cc0ff;--actbg:#1d2c40;--err:#f5a3a3}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
body.locked #side,body.locked #main{display:none}
body:not(.locked) #login{display:none}
#login{margin:auto;width:min(360px,92vw);background:var(--side);border:1px solid var(--line);border-radius:10px;padding:26px 24px}
#login h1{font-size:19px;margin:0 0 4px}
#login p{margin:0 0 16px;color:var(--mut);font-size:13px}
#login label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
#pw{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
#go{width:100%;margin-top:12px;padding:9px;border:0;border-radius:6px;background:var(--act);color:var(--bg);font-weight:700;cursor:pointer}
#go[disabled]{opacity:.6;cursor:wait}
#msg{min-height:18px;margin-top:10px;font-size:13px;color:var(--err)}
#side{width:var(--w);flex:0 0 var(--w);background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
body.collapsed #side{display:none}
.brand{padding:16px 16px 10px;font-size:17px;font-weight:700}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--mut);margin-top:2px}
.search{padding:0 12px 10px}
.search input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--act);outline-offset:1px}
#nav{flex:1;overflow-y:auto;padding:0 8px 12px}
.group{margin:12px 8px 4px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;cursor:pointer}
.item:hover{background:var(--hover)}
.item[aria-current="page"]{background:var(--actbg)}
.item[aria-current="page"] .t{color:var(--act)}
.item .t{display:block;font-weight:600}
.item .d{display:block;font-size:12px;color:var(--mut);margin-top:1px}
.empty{padding:10px 12px;color:var(--mut)}
.foot{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
#lock{border:1px solid var(--line);border-radius:6px;background:none;padding:4px 10px;cursor:pointer;font-size:12px}
#lock:hover{background:var(--hover)}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);min-height:50px}
#toggle{flex:none;width:34px;height:34px;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer;font-size:17px;line-height:1}
#toggle:hover{background:var(--hover)}
.head{flex:1;min-width:0}
#title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meta{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#open{flex:none;font-size:13px;color:var(--act);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;white-space:nowrap}
#open:hover{background:var(--hover)}
#frame{flex:1;width:100%;border:0;background:var(--bg)}
#welcome{flex:1;display:flex;align-items:center;justify-content:center;color:var(--mut);padding:24px;text-align:center}
#frame[hidden],#welcome[hidden],#open[hidden]{display:none}
@media (max-width:760px){
  #side{position:fixed;inset:0 auto 0 0;z-index:5;width:min(var(--w),86vw);box-shadow:0 0 30px rgba(0,0,0,.3)}
  #open{display:none}
}
</style>
</head>
<body class="locked">
<form id="login" autocomplete="off">
  <h1>My memory</h1>
  <p>Enter the password to open the pages.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <button id="go" type="submit">Unlock</button>
  <div id="msg" role="alert"></div>
</form>
<aside id="side">
  <div class="brand">My memory<small>All reports and plans in one place</small></div>
  <div class="search"><input id="q" type="search" placeholder="Search pages  ( / )" aria-label="Search pages" autocomplete="off"></div>
  <nav id="nav" aria-label="Pages"></nav>
  <div class="foot"><span id="count"></span><button id="lock" type="button">Lock</button></div>
</aside>
<div id="main">
  <div id="bar">
    <button id="toggle" type="button" aria-label="Show or hide the sidebar" title="Show or hide the sidebar">&#9776;</button>
    <div class="head"><div id="title">My memory</div><div id="meta"></div></div>
    <a id="open" target="_blank" rel="noopener" hidden>Open in new tab</a>
  </div>
  <iframe id="frame" title="Selected page" hidden></iframe>
  <div id="welcome">Pick a page from the sidebar.</div>
</div>
<script>
// Every page is stored encrypted (AES-256-GCM). The key is derived from the password with PBKDF2;
// neither the password nor the key is part of this site, so a wrong password simply fails to decrypt.
(function () {
  var site = null, key = null, pages = [], urls = {}, current = null;
  var $ = function (id) { return document.getElementById(id); };
  var nav = $('nav'), q = $('q'), frame = $('frame'), welcome = $('welcome');
  var title = $('title'), meta = $('meta'), open = $('open'), msg = $('msg'), go = $('go'), pw = $('pw');

  function fromB64(s) {
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function toB64(a) {
    var s = '';
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  async function derive(password) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: fromB64(site.salt), iterations: site.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  // bytes = 12-byte IV followed by ciphertext and tag
  async function decrypt(bytes) {
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.subarray(0, 12) }, key, bytes.subarray(12));
    return new TextDecoder().decode(plain);
  }
  async function unlock(k) {
    key = k;
    pages = JSON.parse(await decrypt(fromB64(site.manifest)));
    try { sessionStorage.setItem('mm.key', site.salt + ':' + toB64(new Uint8Array(await crypto.subtle.exportKey('raw', k)))); } catch (e) {}
    document.body.classList.remove('locked');
    start();
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function render() {
    var term = q.value.trim().toLowerCase(), shown = 0, lastGroup = null;
    nav.textContent = '';
    pages.forEach(function (p) {
      var hay = [p.title, p.desc, p.group].join(' ').toLowerCase();
      if (term && hay.indexOf(term) === -1) return;
      if (p.group !== lastGroup) { nav.appendChild(el('div', 'group', p.group || 'Other')); lastGroup = p.group; }
      var b = el('button', 'item');
      b.type = 'button';
      b.appendChild(el('span', 't', p.title + (p.newTab ? '  ↗' : '')));
      if (p.desc) b.appendChild(el('span', 'd', p.desc));
      if (current && current.id === p.id) b.setAttribute('aria-current', 'page');
      b.addEventListener('click', function () { select(p, true); });
      nav.appendChild(b);
      shown++;
    });
    if (!shown) nav.appendChild(el('div', 'empty', 'No page matches the search.'));
    $('count').textContent = pages.length + ' page' + (pages.length === 1 ? '' : 's');
  }
  async function select(p, fromClick) {
    if (p.newTab) { if (fromClick) window.open(p.path, '_blank', 'noopener'); return; }
    current = p;
    title.textContent = p.title;
    meta.textContent = [p.group, p.updated ? 'updated ' + p.updated : '', p.desc].filter(Boolean).join('  ·  ');
    document.title = p.title + ' – My memory';
    if (location.hash.slice(1) !== p.id) history.replaceState(null, '', '#' + p.id);
    try { sessionStorage.setItem('mm.last', p.id); } catch (e) {}
    if (fromClick && window.matchMedia('(max-width:760px)').matches) document.body.classList.add('collapsed');
    render();
    if (!urls[p.id]) {
      var res = await fetch('data/' + p.file, { cache: 'no-store' });
      var html = await decrypt(new Uint8Array(await res.arrayBuffer()));
      urls[p.id] = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    }
    if (current !== p) return;
    frame.src = urls[p.id];
    frame.hidden = false; welcome.hidden = true;
    open.href = urls[p.id]; open.hidden = false;
  }
  function byId(id) { return pages.filter(function (p) { return p.id === id && !p.newTab; })[0]; }
  function fromHash() {
    var p = byId(decodeURIComponent(location.hash.slice(1)));
    if (p) select(p, false);
    return !!p;
  }
  function start() {
    render();
    if (!fromHash()) {
      var last = null;
      try { last = byId(sessionStorage.getItem('mm.last')); } catch (e) {}
      var first = last || pages.filter(function (p) { return !p.newTab; })[0];
      if (first) select(first, false);
    }
  }

  $('login').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (!site) return;
    go.disabled = true; msg.textContent = ''; go.textContent = 'Unlocking…';
    try {
      await unlock(await derive(pw.value));
      pw.value = '';
    } catch (e) {
      key = null;
      msg.textContent = 'Wrong password.';
      pw.select();
    }
    go.disabled = false; go.textContent = 'Unlock';
  });
  $('lock').addEventListener('click', function () {
    try { sessionStorage.removeItem('mm.key'); } catch (e) {}
    location.reload();
  });
  $('toggle').addEventListener('click', function () { document.body.classList.toggle('collapsed'); });
  q.addEventListener('input', render);
  window.addEventListener('hashchange', function () { if (key) fromHash(); });
  document.addEventListener('keydown', function (ev) {
    if (key && ev.key === '/' && document.activeElement !== q) { ev.preventDefault(); document.body.classList.remove('collapsed'); q.focus(); }
  });
  if (window.matchMedia('(max-width:760px)').matches) document.body.classList.add('collapsed');

  (async function init() {
    if (!window.crypto || !crypto.subtle) { msg.textContent = 'This browser cannot open the pages (needs HTTPS and a current browser).'; return; }
    try {
      site = await (await fetch('data/site.json', { cache: 'no-store' })).json();
    } catch (e) { msg.textContent = 'Could not load the site data.'; return; }
    // Same tab, already unlocked: reuse the derived key (never the password) kept for this tab only.
    try {
      var saved = (sessionStorage.getItem('mm.key') || '').split(':');
      if (saved.length === 2 && saved[0] === site.salt) {
        await unlock(await crypto.subtle.importKey('raw', fromB64(saved[1]), 'AES-GCM', true, ['decrypt']));
      }
    } catch (e) { key = null; try { sessionStorage.removeItem('mm.key'); } catch (e2) {} }
  })();
})();
</script>
</body>
</html>
